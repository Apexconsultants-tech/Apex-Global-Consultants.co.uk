# Questions shown on /faq/ (topic) and on service pages (services: [slug]).
- id: fixed-fees
  topic: fees
  order: 1
  question: Do you charge fixed fees?
  answer: Yes. After a free consultation we send a written proposal with a fixed fee for the work agreed. You know the cost before any work starts, so there are no surprises.
- id: what-included-fee
  topic: fees
  order: 2
  question: What happens if I need extra work during the year?
  answer: If you need something outside the agreed scope, we tell you before we start and confirm the fee in writing. We never add charges without agreeing them first.
- id: free-consultation
  topic: getting-started
  order: 1
  question: What happens in the free consultation?
  answer: We talk through your business, what you need and any deadlines coming up. It usually takes 30 minutes by phone or video call and there is no obligation.
- id: switching
  topic: getting-started
  order: 2
  question: How do I switch from my current accountant?
  answer: Once you have signed our engagement letter, we contact your previous accountant for the professional clearance and handover information. You do not need to manage that conversation yourself.
- id: identity-checks
  topic: getting-started
  order: 3
  question: Why do you need to check my identity?
  answer: UK anti-money-laundering regulations require us to verify the identity of new clients and their beneficial owners before we act. We do this securely through our client portal, never by email.
- id: where-based
  topic: general
  order: 1
  question: Where are you based and do I need to visit?
  answer: Our office is at the Atlantic Business Centre in Altrincham, Greater Manchester. Most clients work with us by phone, video and our secure portal, so you do not need to visit, but you are welcome to.
- id: software
  topic: general
  order: 2
  question: Which accounting software do you work with?
  answer: We work with Xero, QuickBooks, Sage and FreeAgent, the main cloud accounting packages used by UK businesses, and can recommend the one that suits your size and sector. We also handle migration, bank feeds and training.
- id: response-time
  topic: general
  order: 3
  question: How quickly will you respond?
  answer: Your dedicated accountant aims to reply to emails and messages within one working day, and sooner when a deadline is close.
- id: overseas-uk-entity
  topic: overseas
  order: 1
  question: Can you help us set up a UK company from abroad?
  answer: Yes. We handle company formation at Companies House, HMRC registrations for corporation tax, VAT and PAYE, and your ongoing bookkeeping, accounts and filings, working in your time zone where possible.
- id: overseas-reporting
  topic: overseas
  order: 2
  question: Can you report to our group under IFRS?
  answer: Yes. We prepare UK statutory accounts under FRS 102 and can also provide monthly or year-end reporting packs under IFRS for your group.
# Service-specific questions
- id: bk-software
  topic: service
  services: [bookkeeping]
  question: Do I need to change my bookkeeping software?
  answer: Not usually. We work with the main cloud packages. If your current setup is holding you back, we will explain why and help you move.
- id: bk-frequency
  topic: service
  services: [bookkeeping]
  question: How often will my books be updated?
  answer: Most clients have their books updated and reconciled monthly. Weekly updates are available for businesses with high transaction volumes.
- id: bk-documents
  topic: service
  services: [bookkeeping]
  question: How do I send you receipts and invoices?
  answer: Through receipt-capture apps linked to your accounting software, or by uploading to our secure client portal. Please do not send documents by email.
- id: aa-frs102
  topic: service
  services: [accounting-advisory, compliance]
  question: When do the FRS 102 periodic review changes apply?
  answer: The main changes, including bringing most leases onto the balance sheet and a new five-step revenue model, apply to accounting periods beginning on or after 1 January 2026.
- id: aa-auditor
  topic: service
  services: [accounting-advisory]
  question: Will you work with our auditors?
  answer: Yes. We prepare papers and models with the audit in mind and can respond to technical queries directly with your auditors if you wish.
- id: aa-esg
  topic: service
  services: [accounting-advisory]
  question: Can you help with sustainability reporting?
  answer: We help you identify relevant disclosures, organise the underlying data and draft clear narrative reporting. We do not provide assurance on sustainability information.
- id: tax-mtd
  topic: service
  services: [taxation]
  question: Does Making Tax Digital for Income Tax apply to me?
  answer: It applies to sole traders and landlords in stages based on qualifying income, starting with incomes over £50,000 from April 2026. We will confirm your position and the date that applies to you.
- id: tax-vat-register
  topic: service
  services: [taxation]
  question: When do I need to register for VAT?
  answer: You must register if your VAT-taxable turnover goes over the registration threshold in any rolling 12-month period, or is expected to within the next 30 days. Voluntary registration can also make sense; we will advise you.
- id: tax-hmrc-letters
  topic: service
  services: [taxation]
  question: Can you deal with HMRC for me?
  answer: Yes. Once you authorise us as your agent, we can speak to HMRC on your behalf and respond to letters and enquiries.
- id: pay-switch
  topic: service
  services: [payroll-processing]
  question: Can you take over payroll part-way through the tax year?
  answer: Yes. We take the year-to-date figures from your previous payroll so that tax and National Insurance continue correctly.
- id: pay-pension
  topic: service
  services: [payroll-processing]
  question: Do you handle workplace pension auto-enrolment?
  answer: We calculate pension contributions through payroll and can help you meet your auto-enrolment duties with your pension provider.
- id: pay-payslips
  topic: service
  services: [payroll-processing]
  question: How do employees receive payslips?
  answer: Employees receive secure electronic payslips. Printed payslips can be arranged if required.
- id: cs-time
  topic: service
  services: [corporate-services]
  question: How long does it take to form a UK company?
  answer: Online incorporation at Companies House is often completed within 24 hours once all information and identity verification are in place.
- id: cs-idv
  topic: service
  services: [corporate-services, compliance]
  question: Do directors need to verify their identity with Companies House?
  answer: Yes. Directors and people with significant control must verify their identity with Companies House. We can tell you how and when this applies to you.
- id: comp-dormant
  topic: service
  services: [compliance]
  question: Do dormant companies still need to file accounts?
  answer: Yes. A dormant company must still file annual accounts and a confirmation statement with Companies House.
- id: comp-internal-audit
  topic: service
  services: [compliance]
  question: Is internal audit only for large companies?
  answer: No. A focused review of key processes, such as payments or payroll, is valuable for any business and can be scaled to your size.
- id: mr-frequency
  topic: service
  services: [management-reporting]
  question: How soon after month end will I get my report?
  answer: We agree a timetable with you at the start. It depends on how quickly records are available, but we aim for a consistent date each month.
- id: mr-kpis
  topic: service
  services: [management-reporting]
  question: Which KPIs should I track?
  answer: It depends on your business model. We agree a short list with you, usually covering margin, cash, debtor days and one or two measures specific to your sector.
- id: mr-forecast
  topic: service
  services: [management-reporting, specialised-support]
  question: Can you help prepare forecasts for a bank or investor?
  answer: Yes. We build forecasts with clearly stated assumptions and can join meetings to explain them.
- id: ss-migration
  topic: service
  services: [specialised-support]
  question: How long does a move to cloud accounting take?
  answer: Most small businesses can move within a few weeks, timed for the start of a VAT quarter or financial year to keep things simple.
- id: ss-forensic
  topic: service
  services: [specialised-support]
  question: When would I need forensic accounting?
  answer: When records need to be reconstructed or a loss, dispute or irregularity needs to be investigated. We will discuss the scope confidentially before any work begins.

# ---- Added November 2026 from the client's price list and guides ----
# topic: the section on /faq/. services / audiences: which service and "Who we help" pages also show it.
- id: fees-bookkeeping
  topic: fees
  order: 3
  services: [bookkeeping]
  audiences: [uk-small-and-medium-businesses, individuals-and-sole-traders]
  question: How much does bookkeeping cost?
  answer: Our bookkeeping costs £99 a month for up to 50 transactions a month. That covers recording and categorising transactions, bank and account reconciliation and a monthly management summary. Busier businesses get a fixed monthly quote based on transaction volume and the number of bank accounts.
- id: fees-payroll
  topic: fees
  order: 4
  services: [payroll-processing]
  audiences: [uk-small-and-medium-businesses]
  question: How much does payroll cost?
  answer: Payroll starts from £30 a month for up to 4 employees, then £5 a month for each additional employee. It covers PAYE and RTI submissions to HMRC, pension auto-enrolment support, payslips, P60s, P45s and year-end reporting.
- id: fees-tax-returns
  topic: fees
  order: 5
  services: [taxation]
  audiences: [individuals-and-sole-traders, uk-small-and-medium-businesses]
  question: How much does a tax return cost?
  answer: A Self Assessment tax return starts from £150, VAT returns from £75 per return and a Corporation Tax return from £350. The exact fee depends on your income sources and records, and we confirm it in writing before we start.
- id: fees-other-services
  topic: fees
  order: 6
  question: What do your other services cost?
  answer: Management reporting starts from £175 a month, accounting advisory from £125 an hour, specialised IFRS and reporting projects from £450 a project, corporate services from £150 per service and ongoing compliance support from £250 a year. Our pricing page shows what each one includes.
- id: tax-need-return
  topic: individuals
  order: 1
  services: [taxation]
  audiences: [individuals-and-sole-traders]
  question: Do I need to file a Self Assessment tax return?
  answer: Usually yes if you are self-employed and your trading income is over £1,000 a year, if you receive rental income, if you have untaxed income such as overseas income, or if HMRC asks you to. This applies even if you also have a PAYE job. If you are unsure, we will check for you.
- id: tax-deadlines
  topic: individuals
  order: 2
  services: [taxation]
  audiences: [individuals-and-sole-traders]
  question: When are the Self Assessment deadlines?
  answer: Online tax returns and any tax owed are due by 31 January after the end of the tax year, along with your first payment on account for the current year. The second payment on account is due by 31 July. If you are newly self-employed, register with HMRC by 5 October after the end of your first tax year.
- id: tax-payments-on-account
  topic: individuals
  order: 3
  services: [taxation]
  audiences: [individuals-and-sole-traders]
  question: What are payments on account?
  answer: If your Self Assessment tax bill is over £1,000, HMRC usually asks you to pay half of next year's tax in advance, in January and July. We work out what you owe and tell you what to set aside each month so the payments are not a surprise.
- id: tax-drivers
  topic: individuals
  order: 4
  services: [taxation]
  audiences: [individuals-and-sole-traders]
  question: I drive for Uber, Bolt or a minicab firm. What can I claim?
  answer: You declare your full fares, including tips and bonuses, then claim expenses such as app commission, licences, phone costs and parking. For your car you claim either a mileage rate (55p a mile for the first 10,000 business miles in 2026/27) or a share of your actual running costs. Our tax guide for drivers explains both.
- id: tax-hmrc-letter
  topic: individuals
  order: 5
  services: [taxation]
  audiences: [individuals-and-sole-traders]
  question: I have had a letter from HMRC about my income. What should I do?
  answer: Do not ignore it. Online platforms now report earnings to HMRC, so it can compare them with your returns. Telling HMRC about anything you missed before it finds it usually means lower penalties. We can review your position and make the disclosure for you.
- id: mtd-who
  topic: tax
  order: 1
  services: [taxation, bookkeeping]
  audiences: [individuals-and-sole-traders]
  question: Does Making Tax Digital for Income Tax apply to me?
  answer: It applies to sole traders and landlords whose qualifying income (gross self-employment turnover plus gross rental income) is over £50,000 from 6 April 2026, over £30,000 from April 2027 and over £20,000 from April 2028. HMRC uses your tax return from two years earlier to decide. Employment income, pensions and dividends do not count.
- id: mtd-quarterly
  topic: tax
  order: 2
  services: [taxation]
  question: What do I have to send HMRC under Making Tax Digital?
  answer: You keep digital records in compatible software, send four quarterly updates (due 7 August, 7 November, 7 February and 7 May) and then a final declaration by 31 January that replaces your tax return. Each update is still due even if you had no income in that quarter.
- id: mtd-tax-change
  topic: tax
  order: 3
  services: [taxation]
  question: Does Making Tax Digital change how much tax I pay?
  answer: No. Making Tax Digital changes how and how often you report your income, not the tax rates or the 31 January and 31 July payment dates.
- id: mtd-spreadsheets
  topic: tax
  order: 4
  services: [taxation, bookkeeping]
  question: Can I keep using spreadsheets for Making Tax Digital?
  answer: Yes, as long as you use bridging software to send the figures to HMRC digitally. Many landlords and simple businesses do this, although cloud software with bank feeds usually saves more time.
- id: mtd-agent
  topic: tax
  order: 5
  services: [taxation, bookkeeping]
  audiences: [individuals-and-sole-traders]
  question: Can you handle Making Tax Digital for me?
  answer: Yes. Once you authorise us as your agent with HMRC, we set up compatible software, keep your digital records, submit every quarterly update on time and file your final declaration.
- id: mtd-vat
  topic: tax
  order: 6
  services: [taxation]
  question: Does Making Tax Digital apply to VAT?
  answer: Yes. Since April 2022 every VAT-registered business must keep digital VAT records and file VAT returns through compatible software, whatever its turnover. The VAT registration threshold is £90,000 of taxable turnover in a rolling 12 months.
- id: payroll-director-only
  topic: payroll
  order: 1
  services: [payroll-processing]
  audiences: [uk-small-and-medium-businesses]
  question: Do I need a payroll if I am the only director?
  answer: Usually yes. If you pay yourself a salary above the lower earnings limit, you must register as an employer with HMRC and report each payment in real time, even if you are the only person on the payroll. We set this up for you.
- id: payroll-director-salary
  topic: payroll
  order: 2
  services: [payroll-processing, taxation]
  audiences: [uk-small-and-medium-businesses]
  question: What salary should I pay myself as a company director?
  answer: Many directors take a small salary, often around the lower earnings limit (£6,708) or the personal allowance (£12,570) in 2026/27, and take the rest as dividends from profits. The right mix depends on your profits, other income and pension plans, so we work it out with you each year.
- id: payroll-deadlines
  topic: payroll
  order: 3
  services: [payroll-processing]
  question: When do employers have to report and pay HMRC?
  answer: You send a Full Payment Submission to HMRC on or before each payday, and pay PAYE, National Insurance and student loan deductions by the 22nd of the following month in cleared funds. Pension contributions are also due by the 22nd.
- id: payroll-pension
  topic: payroll
  order: 4
  services: [payroll-processing]
  question: Do I have to put my employees into a workplace pension?
  answer: Yes. You must automatically enrol workers aged 22 to State Pension age who earn over £10,000 a year. Total contributions must be at least 8% of qualifying earnings, with at least 3% from you as the employer.
- id: company-audit
  topic: companies
  order: 1
  services: [compliance]
  audiences: [uk-small-and-medium-businesses, overseas-companies, finance-teams]
  question: Does my company need an audit?
  answer: Most small companies are exempt. For financial years starting on or after 6 April 2025, a company is small if it meets two of three limits (turnover up to £15 million, balance sheet total up to £7.5 million, up to 50 employees), normally for two years in a row. Group membership, your articles or your shareholders can still require an audit.
- id: company-size
  topic: companies
  order: 2
  services: [compliance, corporate-services]
  question: What are the new company size thresholds?
  answer: From 6 April 2025, a micro company has turnover up to £1 million, a balance sheet up to £500,000 and up to 10 employees; a small company up to £15 million, £7.5 million and 50 employees; and a medium company up to £54 million, £27 million and 250 employees. You need to meet two of the three limits.
- id: company-ifrs-smes
  topic: companies
  order: 3
  services: [accounting-advisory, specialised-support]
  audiences: [finance-teams, overseas-companies]
  question: When does the revised IFRS for SMEs take effect?
  answer: The third edition of the IFRS for SMEs Accounting Standard applies to accounting periods starting on or after 1 January 2027, and early adoption is allowed. It brings revenue, fair value, consolidation, financial instruments and business combinations closer to full IFRS; leases are unchanged for now.
- id: company-cash-flow
  topic: companies
  order: 4
  services: [accounting-advisory, management-reporting]
  audiences: [finance-teams]
  question: Can you review our cash flow statement before we file?
  answer: Yes. We check the classification of interest, overdrafts, leases, acquisitions and intragroup balances, the reconciliation to the rest of the accounts and the non-cash disclosures IAS 7 requires. These are the areas the FRC most often challenges.
- id: startup-loan
  topic: getting-started
  order: 4
  services: [management-reporting, corporate-services]
  audiences: [uk-small-and-medium-businesses, individuals-and-sole-traders]
  question: Can you help me apply for a Start Up Loan?
  answer: Yes. Start Up Loans are government-backed personal loans of £500 to £25,000 at a 7.5% fixed rate. We prepare the business plan, 12-month cash flow forecast and personal survival budget for your application, then look after your accounts and tax once you are trading.
